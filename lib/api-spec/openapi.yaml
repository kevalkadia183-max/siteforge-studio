                $ref: "#/components/schemas/OutreachDraftRecord"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Feature disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Draft not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Draft not editable or lead blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/{leadId}/outreach/{draftId}/review:
    post:
      operationId: reviewOutreachDraft
      tags: [lead-acquisition]
      summary: Explicitly mark the current outreach copy as reviewed
      parameters:
        - $ref: "#/components/parameters/LeadId"
        - $ref: "#/components/parameters/DraftId"
      responses:
        "200":
          description: Draft marked reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachDraftRecord"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Feature disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Draft not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Draft not reviewable or lead blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/{leadId}/outreach/{draftId}/gmail-draft:
    post:
      operationId: createOutreachGmailDraft
      tags: [lead-acquisition]
      summary: Create a Gmail draft for a reviewed outreach draft (never sends)
      description: >
        Requires the current copy to be reviewed and the lead to be eligible
        (rechecked under the per-lead advisory lock + transaction). Creates a
        Gmail DRAFT only — never sends, never marks sent/delivered. Success
        status is gmail_draft_created. Idempotent: if a Gmail draft has already
        been created for this outreach draft, returns 200 with
        status=gmail_draft_created and the existing record (not an error).
        Subject and recipient are validated for header safety before any provider
        call. The Gmail and opt-out paths share a per-lead advisory lock so an
        opt-out committed before Gmail starts always blocks it.
        An ambiguous provider outcome stays reconciliation-pending and never
        permits another Gmail create request. Repeating this endpoint while
        pending performs a lookup only. A found draft is reconciled; an
        unavailable or not-yet-indexed result stays pending; and a confirmed
        absence after the safety delay becomes retry-ready for a separate,
        later owner action.
      parameters:
        - $ref: "#/components/parameters/LeadId"
        - $ref: "#/components/parameters/DraftId"
      responses:
        "200":
          description: >
            Gmail draft created (status=gmail_draft_created), or idempotent
            success if already created, or WhatsApp channel not configured
            (status=provider_not_configured, no side effect).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachGmailResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Feature disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Draft not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Not reviewed, lead blocked, reconciliation still pending, or a
            confirmed-absent attempt has just become retry-ready. A pending
            response never creates another Gmail draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: >
            Gmail did not confirm the draft. The attempt remains
            reconciliation-pending and a later call performs lookup only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/{leadId}/outreach/{draftId}/discard:
    post:
      operationId: discardOutreachDraft
      tags: [lead-acquisition]
      summary: Discard an outreach draft
      description: >
        Reloads the owner-scoped lead FOR UPDATE and checks DNC/opt-out before
        acting. Returns 409 if the lead is suppressed or has opted out, or if
        the draft is already discarded.
      parameters:
        - $ref: "#/components/parameters/LeadId"
        - $ref: "#/components/parameters/DraftId"
      responses:
        "200":
          description: Draft discarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachDraftRecord"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Feature disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Draft not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Draft already terminal, or lead is suppressed/opted-out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/{leadId}/outreach/{draftId}/reply:
    post:
      operationId: markOutreachReply
      tags: [lead-acquisition]
      summary: Manually mark that a reply was received for an outreach draft
      description: >
        Reloads the owner-scoped lead FOR UPDATE and checks DNC/opt-out before
        acting. Returns 409 if the lead is suppressed or has opted out.
        Records only a human-observed reply — never invents delivery events.
      parameters:
        - $ref: "#/components/parameters/LeadId"
        - $ref: "#/components/parameters/DraftId"
      responses:
        "200":
          description: Reply marked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachDraftRecord"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Feature disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Draft not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Lead is suppressed or opted out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/{leadId}/outreach/opt-out:
    post:
      operationId: optOutLeadOutreach
      tags: [lead-acquisition]
      summary: Opt a lead out of all outreach (permanent Do Not Contact)
      description: >
        Records a permanent outreach opt-out. In a single transaction under the
        per-lead advisory lock this upserts the durable outreach opt-out row,
        upserts the canonical lead_acquisition_suppressions record (honest
        "Outreach opt-out" reason), and sets leads.suppressed=true. The response
        reflects the ACTUAL updated suppression state. Because the canonical
        suppression is written, the opt-out propagates to prospect generation,
        dashboards, and every other DNC consumer, and it cannot be undone by the
        ordinary unsuppress endpoint.
      parameters:
        - $ref: "#/components/parameters/LeadId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutreachOptOutRequest"
      responses:
        "200":
          description: Lead opted out; outreach suppressed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadOutreachSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Feature disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Public Prospect Preview Delivery ──────────────────────────────────────
  /prospect-previews/{mappingId}/{signature}/:
    get:
      operationId: getProspectPreviewAsset
      tags: [lead-acquisition]
      summary: Serve a signed public prospect preview index page
      description: >
        Public endpoint (no auth). The mappingId is a high-entropy random value
        and the signature is an HMAC embedded as a path segment (not a query
        param) so relative assets resolve under the signed prefix. The signature
        is verified server-side via HMAC. The frozen, validated site captured at
        publish time is served verbatim from the shared preview store — the
        editable website source is never re-read or re-generated here. Returns
        404 no-store if unavailable, expired, or tampered. No signature appears
        in logs.
      parameters:
        - in: path
          name: mappingId
          required: true
          schema:
            type: string
        - in: path
          name: signature
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Preview index page (HTML)
        "404":
          description: Preview unavailable
          content:
            text/plain:
              schema:
                type: string

  /prospect-previews/{mappingId}/{signature}/{asset}:
    get:
      operationId: getProspectPreviewFile
      tags: [lead-acquisition]
      summary: Serve a signed public prospect preview file (page/CSS/JS/image)
      description: >
        Public endpoint (no auth). Serves an individual frozen asset under the
        signed prefix (styles.css, main.js, additional pages, or images). The
        frozen site is served verbatim with a strict prospect CSP
        (img-src 'self' data:, connect-src 'none'); no external media or
        network access is permitted. Returns 404 no-store if unavailable,
        expired, or tampered.
      parameters:
        - in: path
          name: mappingId
          required: true
          schema:
            type: string
        - in: path
          name: signature
          required: true
          schema:
            type: string
        - in: path
          name: asset
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Preview file
        "404":
          description: Preview unavailable
          content:
            text/plain:
              schema:
                type: string

components:
  parameters:
    LeadId:
      in: path
      name: leadId
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    DraftId:
      in: path
      name: draftId
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    SetupKey:
      in: header
      name: X-SiteForge-Setup-Key
      required: false
      description: Required only for legacy pilot provisioning without a signed-in Clerk session
      schema:
        type: string
        minLength: 16
        maxLength: 256
    EditorKey:
      in: header
      name: X-SiteForge-Editor-Key
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 128
    PreviewId:
      in: path
      name: previewId
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 128
    OwnerKey:
      in: header
      name: X-SiteForge-Owner-Key
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    ReceptionistId:
      in: path
      name: receptionistId
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ConversationId:
      in: path
      name: conversationId
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    SessionToken:
      in: header
      name: X-SiteForge-Session-Token
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    MessageId:
      in: path
      name: messageId
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WebsiteId:
      in: path
      name: websiteId
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GeneratedSite:
      type: object
      additionalProperties: false
      properties:
        pages:
          type: object
          minProperties: 1
          maxProperties: 4
          additionalProperties:
            type: string
            maxLength: 25000
        css:
          type: string
          maxLength: 50000
        js:
          type: string
          maxLength: 10000
        media:
          type: object
          maxProperties: 24
          additionalProperties:
            $ref: "#/components/schemas/GeneratedMediaAsset"
      required:
        - pages
        - css
        - js
    GeneratedMediaAsset:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[a-zA-Z0-9_-]+$"
        name:
          type: string
          minLength: 1
          maxLength: 128
        mimeType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - image/gif
            - image/avif
        dataUrl:
          type: string
          minLength: 1
          maxLength: 410000
      required:
        - id
        - name
        - mimeType
        - dataUrl
    PreviewPublishRequest:
      type: object
      additionalProperties: false
      properties:
        projectId:
          type: string
          minLength: 1
          maxLength: 128
        projectUpdatedAt:
          type: number
          minimum: 0
        site:
          $ref: "#/components/schemas/GeneratedSite"
      required:
        - projectId
        - projectUpdatedAt
        - site
    PreviewRefreshRequest:
      type: object
      additionalProperties: false
      properties:
        projectUpdatedAt:
          type: number
          minimum: 0
        site:
          $ref: "#/components/schemas/GeneratedSite"
      required:
        - projectUpdatedAt
        - site
    PreviewPublication:
      type: object
      additionalProperties: false
      properties:
        previewId:
          type: string
        path:
          type: string
        expiresAt:
          type: string
