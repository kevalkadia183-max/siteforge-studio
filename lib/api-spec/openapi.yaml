    # ── Prospect Lifecycle Schemas ──────────────────────────────────────────

    ProspectVerifiedFields:
      type: object
      additionalProperties: false
      description: >
        Allowlisted field names from the lead record to include in generation.
        businessName is required. Values are server-derived from stored lead
        data; clients must not supply values.
      properties:
        businessName:
          type: boolean
          enum: [true]
        category:
          type: boolean
        description:
          type: boolean
        city:
          type: boolean
        region:
          type: boolean
        address:
          type: boolean
        postalCode:
          type: boolean
        country:
          type: boolean
        phone:
          type: boolean
        email:
          type: boolean
        services:
          type: boolean
      required:
        - businessName

    ProspectGenerateRequest:
      type: object
      additionalProperties: false
      description: >
        Request to generate or regenerate a prospect site. templateId may be
        explicitly overridden (must be a valid TemplateId); if omitted the
        server derives one from the lead's category. verifiedFields selects
        which lead fields to include (server reads values from lead record).
      properties:
        templateId:
          type: string
          description: Override template selection (optional).
        verifiedFields:
          $ref: "#/components/schemas/ProspectVerifiedFields"
      required:
        - verifiedFields

    ProspectPreviewRequest:
      type: object
      additionalProperties: false
      properties:
        expectedRevision:
          type: number
          minimum: 0
          description: >
            Must match the current website revision. Ensures the preview
            is published from the exact version the caller has seen.
      required:
        - expectedRevision

    ProspectConvertRequest:
      type: object
      additionalProperties: false
      properties:
        expectedRevision:
          type: number
          minimum: 0
          description: >
            Must match the current website revision. Conversion will atomically
            change the website type and increment revision.
      required:
        - expectedRevision

    ProspectSiteRecord:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        leadId:
          type: string
        state:
          type: string
          enum: [active_draft, archived, converted]
        websiteId:
          type: ["string", "null"]
        websiteRevision:
          type: ["number", "null"]
          description: Current website revision (null if no active website).
        templateId:
          type: ["string", "null"]
          description: >
            Template used for the current generation. Null if no generation
            exists or if the value was not recorded.
        generationCount:
          type: number
        hasActivePreview:
          type: boolean
        previewPath:
          type: ["string", "null"]
          description: >
            Full path (with signature query parameter) to the active public
            prospect preview, recomputed from the stored mapping on every GET.
            Null when no unexpired preview exists. Signature is never logged.
        previewExpiresAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: ["string", "null"]
          format: date-time
        convertedAt:
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - leadId
        - state
        - websiteId
        - websiteRevision
        - templateId
        - generationCount
        - hasActivePreview
        - previewPath
        - previewExpiresAt
        - createdAt
        - updatedAt
        - archivedAt
        - convertedAt

    ProspectPreviewPublication:
      type: object
      additionalProperties: false
      properties:
        mappingId:
          type: string
        path:
          type: string
          description: Full URL path including signature query parameter.
        expiresAt:
          type: string
          format: date-time
        websiteRevision:
          type: number
      required:
        - mappingId
        - path
        - expiresAt
        - websiteRevision

    ProspectConvertResult:
      type: object
      additionalProperties: false
      properties:
        lifecycleId:
          type: string
        websiteId:
          type: string
        newRevision:
          type: number
        leadStatus:
          type: string
      required:
        - lifecycleId
        - websiteId
        - newRevision
        - leadStatus

    OutreachFactReference:
      type: object
      additionalProperties: false
      description: A single fact used to render outreach copy (audit snapshot entry).
      properties:
        fieldName:
          type: string
          maxLength: 64
        value:
          type: string
          maxLength: 2048
        provenance:
          type: string
          enum: [user_provided, imported, verified, inferred, ai_generated, provider]
        sourceId:
          type: ["string", "null"]
          maxLength: 128
      required:
        - fieldName
        - value
        - provenance

    OutreachDraftRecord:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        leadId:
          type: string
        leadBusinessName:
          type: ["string", "null"]
          maxLength: 300
          description: >
            Business name from the associated lead row, populated server-side
            via an owner-scoped join. Never accepted from the client.
        recipientDisplay:
          type: ["string", "null"]
          maxLength: 320
          description: >
            Safe recipient identifier for display: the lead's stored email for
            email-channel drafts, or the lead's stored phone for whatsapp-channel
            drafts. Populated server-side from an owner-scoped join.
            Never accepted from the client. Null when the lead has no value for
            the relevant contact field.
        channel:
          type: string
          enum: [email, whatsapp]
        status:
          type: string
          enum: [draft, reviewed, gmail_draft_created, discarded, replied]
        gmailState:
          type: string
          enum: [none, requesting, created, failed]
        subject:
          type: ["string", "null"]
          maxLength: 500
        body:
          type: string
          maxLength: 20000
        factSnapshot:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/OutreachFactReference"
        gmailDraftId:
          type: ["string", "null"]
          maxLength: 256
        failureReason:
          type: ["string", "null"]
          maxLength: 500
        reviewed:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        reviewedAt:
          type: ["string", "null"]
          format: date-time
        gmailDraftCreatedAt:
          type: ["string", "null"]
          format: date-time
        repliedAt:
          type: ["string", "null"]
          format: date-time
        discardedAt:
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - leadId
        - channel
        - status
        - gmailState
        - body
        - reviewed
        - createdAt
        - updatedAt

    OutreachEventRecord:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        draftId:
          type: string
        eventType:
          type: string
          enum: [created, edited, reviewed, discarded, gmail_requested, gmail_created, gmail_failed, gmail_reconciliation_pending, gmail_reconciled, gmail_retry_ready, reply_marked, opted_out]
        performedBy:
          type: ["string", "null"]
          maxLength: 128
        occurredAt:
          type: string
          format: date-time
      required:
        - id
        - draftId
        - eventType
        - occurredAt

    LeadOutreachSummary:
      type: object
      additionalProperties: false
      properties:
        leadId:
          type: string
        optedOut:
          type: boolean
        suppressed:
          type: boolean
        blockedReason:
          type: ["string", "null"]
          maxLength: 500
          description: >
            Human-readable reason outreach is blocked, or null when not blocked.
            Priority: opt-out wording takes precedence over generic suppression
            wording when an outreach opt-out row exists, even if the lead is also
            suppressed, because opt-out is the more specific, user-intentional
            reason and both states block outreach equally.
        drafts:
          type: array
          items:
            $ref: "#/components/schemas/OutreachDraftRecord"
        history:
          type: array
          items:
            $ref: "#/components/schemas/OutreachEventRecord"
      required:
        - leadId
        - optedOut
        - suppressed
        - blockedReason
        - drafts
        - history

    OutreachDraftList:
      type: object
      additionalProperties: false
      properties:
        drafts:
          type: array
          items:
            $ref: "#/components/schemas/OutreachDraftRecord"
        total:
          type: number
        limit:
          type: number
        offset:
          type: number
      required:
        - drafts
        - total
        - limit
        - offset

    CreateOutreachDraftRequest:
      type: object
      additionalProperties: false
      description: >
        Create a first-contact outreach draft. selectedFields is an allowlisted
        subset of fact field names; the server reads values from the stored lead.
        confirmImportedFields lets the owner explicitly confirm allowlisted
        fields whose stored provenance is not yet approved, appending verified
        source rows from the stored values before rendering.
      properties:
        channel:
          type: string
          enum: [email, whatsapp]
        selectedFields:
          type: array
          items:
            type: string
            enum: [businessName, category, city, region, websiteUrl, services, description]
          minItems: 1
          maxItems: 7
        confirmImportedFields:
          type: array
          items:
            type: string
            enum: [businessName, category, city, region, websiteUrl, services, description]
          maxItems: 7
      required:
        - selectedFields

    UpdateOutreachDraftRequest:
      type: object
      additionalProperties: false
      properties:
        subject:
          type: ["string", "null"]
          maxLength: 500
        body:
          type: string
          minLength: 1
          maxLength: 20000
      required:
        - body

    OutreachOptOutRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
        channel:
          type: string
          enum: [email, whatsapp]

    OutreachGmailResult:
      type: object
      additionalProperties: false
      description: >
        Result of a Gmail draft creation attempt or a WhatsApp-not-configured
        report. On email success, status is gmail_draft_created. WhatsApp always
        returns provider_not_configured with no side effects.
      properties:
        draftId:
          type: string
        channel:
          type: string
          enum: [email, whatsapp]
        status:
          type: string
          enum: [gmail_draft_created, provider_not_configured]
        gmailDraftId:
          type: ["string", "null"]
          maxLength: 256
        message:
          type: ["string", "null"]
          maxLength: 500
        draft:
          $ref: "#/components/schemas/OutreachDraftRecord"
      required:
        - draftId
        - channel
        - status
        - draft

