          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: generateProspectSite
      tags: [lead-acquisition]
      summary: Generate an editable prospect site draft for a lead
      description: >
        Lead must be qualified and not suppressed. verifiedFields is an
        allowlisted subset of the lead's stored verified data. businessName
        is required. The server derives field values from the lead record;
        the client must never supply values. Creates a new prospect lifecycle
        entry and website. Conflicts with an existing active draft.
      parameters:
        - $ref: "#/components/parameters/LeadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProspectGenerateRequest"
      responses:
        "201":
          description: Prospect site generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProspectSiteRecord"
        "400":
          description: Invalid request or lead not qualified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Feature disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Active draft already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

