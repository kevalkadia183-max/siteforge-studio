          type: string
          minLength: 1
          maxLength: 120
        location:
          type: string
          minLength: 1
          maxLength: 200
        maxResults:
          type: number
          minimum: 1
          maximum: 20
          default: 10
      required:
        - category
        - location

    BusinessDiscoveryFactFieldName:
      type: string
      enum:
        - businessName
        - category
        - address
        - city
        - region
        - postalCode
        - phone
        - email
        - websiteUrl

    BusinessDiscoveryFact:
      type: object
      additionalProperties: false
      properties:
        fieldName:
          $ref: "#/components/schemas/BusinessDiscoveryFactFieldName"
        value:
          type: string
        provenance:
          type: string
          enum: [provider]
        provider:
          type: string
        providerReference:
          type: string
      required:
        - fieldName
        - value
        - provenance
        - provider
        - providerReference

    BusinessDiscoveryImage:
      type: object
      additionalProperties: false
      description: >
        A business image returned by the discovery provider.
        Images with eligibility "uncertain" are NEVER eligible for use on a
        prospect site — only images with eligibility "approved" may be used.
      properties:
        url:
          type: string
        sourceUrl:
          type: ["string", "null"]
        eligibility:
          type: string
          enum: [approved, uncertain]
        reason:
          type: ["string", "null"]
      required:
        - url
        - eligibility

    BusinessDiscoveryBusiness:
      type: object
      additionalProperties: false
      properties:
        providerReference:
          type: string
        facts:
          type: array
          items:
            $ref: "#/components/schemas/BusinessDiscoveryFact"
        images:
          type: array
          items:
            $ref: "#/components/schemas/BusinessDiscoveryImage"
      required:
        - providerReference
        - facts
        - images

    BusinessDiscoverySearchResult:
      type: object
      additionalProperties: false
      properties:
        provider:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/BusinessDiscoveryBusiness"
        requestId:
          type: string
        quota:
          oneOf:
            - $ref: "#/components/schemas/ProviderQuota"
            - type: "null"
      required:
        - provider
        - items
        - requestId

    # ─── Lead Channel Consent ─────────────────────────────────────────────────

    LeadChannelConsent:
      type: object
      additionalProperties: false
      properties:
        leadId:
          type: string
        channel:
          type: string
          enum: [whatsapp]
        status:
          type: string
          enum: [granted, revoked, unknown]
        source:
          type: string
        evidenceRef:
          type: ["string", "null"]
        capturedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - leadId
        - channel
        - status
        - source
        - capturedAt
        - updatedAt

    LeadWhatsAppConsentUpdate:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [granted, revoked]
        source:
          type: string
          minLength: 1
          maxLength: 64
        evidenceRef:
          type: ["string", "null"]
          maxLength: 500
      required:
        - status
        - source

    # ─── Provider Error Types ─────────────────────────────────────────────────

    RateLimitError:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
        message:
          type: string
        retryAt:
          type: ["string", "null"]
          format: date-time
      required:
        - error
        - message

    ProviderUnavailableError:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
        message:
          type: string
        availability:
          $ref: "#/components/schemas/ProviderAvailability"
      required:
        - error
        - message
        - availability
