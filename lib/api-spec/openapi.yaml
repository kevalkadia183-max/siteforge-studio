    SiteProjectMediaAsset:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 256
        mimeType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - image/gif
            - image/avif
        dataUrl:
          type: string
          minLength: 1
          maxLength: 500000
      required:
        - id
        - name
        - mimeType
        - dataUrl

    SiteProjectSectionItem:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 512
        description:
          type: string
          maxLength: 4000
