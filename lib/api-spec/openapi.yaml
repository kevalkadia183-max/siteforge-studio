  # ─── Lead Outreach Routes ──────────────────────────────────────────────────
  /outreach/drafts:
    get:
      operationId: listOutreachDrafts
      tags: [lead-acquisition]
      summary: Central owner-scoped list of outreach drafts
      description: >
        Owner-scoped list across all leads. Filter by channel/status; paginate
        with limit/offset. When search is provided, the server performs a
        case-insensitive match over the associated lead's businessName, email,
        and phone via an owner-scoped join. ownerId is always derived from the
        session; leadBusinessName and recipientDisplay are server-derived.
      parameters:
        - in: query
          name: channel
          required: false
          schema:
            type: string
            enum: [email, whatsapp]
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [draft, reviewed, gmail_draft_created, discarded, replied]
        - in: query
          name: search
          required: false
          description: >
            Case-insensitive substring match over the associated lead's
            businessName, email, and phone. Max 200 characters. Triggers a
            server-side join; count and pagination remain correct.
          schema:
            type: string
            maxLength: 200
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Outreach draft list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachDraftList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Feature disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/{leadId}/outreach:
    get:
      operationId: getLeadOutreach
      tags: [lead-acquisition]
      summary: Get outreach summary, drafts, and history for a lead
      parameters:
        - $ref: "#/components/parameters/LeadId"
      responses:
        "200":
          description: Outreach summary for the lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadOutreachSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Feature disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createOutreachDraft
      tags: [lead-acquisition]
      summary: Create a fact-grounded first-contact outreach draft
      description: >
        Lead must be qualified and not blocked (suppressed or opted out).
        selectedFields is an allowlisted subset of fact field names. The server
        rereads stored lead values and only uses user_provided or verified
        provenance. businessName is required. If confirmImportedFields is set,
        the server appends verified source rows from stored values for those
        allowlisted fields before rendering. Deterministic copy only — no LLM.
      parameters:
        - $ref: "#/components/parameters/LeadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOutreachDraftRequest"
      responses:
        "201":
          description: Outreach draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachDraftRecord"
        "400":
          description: Invalid request or lead not qualified or no usable facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Feature disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Lead blocked (suppressed or opted out)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/{leadId}/outreach/{draftId}:
    patch:
      operationId: updateOutreachDraft
      tags: [lead-acquisition]
      summary: Update subject/body of an outreach draft (clears review)
      parameters:
        - $ref: "#/components/parameters/LeadId"
        - $ref: "#/components/parameters/DraftId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOutreachDraftRequest"
      responses:
        "200":
          description: Outreach draft updated
          content:
            application/json:
