      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        type:
          type: string
          enum:
            - hero
            - features
            - services-list
            - about-text
            - testimonials
            - contact-form
            - gallery
            - faq
            - stats
            - team
        title:
          type: ["string", "null"]
          maxLength: 512
        subtitle:
          type: ["string", "null"]
          maxLength: 1024
        content:
          type: ["string", "null"]
          maxLength: 10000
        image:
          $ref: "#/components/schemas/SiteProjectMediaAsset"
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/SiteProjectSectionItem"
      required:
        - id
        - type

    SiteProjectPage:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          enum: [home, about, services, contact]
        name:
          type: string
          minLength: 1
          maxLength: 128
        sections:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/SiteProjectSection"
      required:
        - id
        - name
        - sections

    SiteProjectPages:
      type: object
      additionalProperties: false
      properties:
        home:
          $ref: "#/components/schemas/SiteProjectPage"
        about:
          $ref: "#/components/schemas/SiteProjectPage"
        services:
          $ref: "#/components/schemas/SiteProjectPage"
        contact:
          $ref: "#/components/schemas/SiteProjectPage"
      required:
        - home
        - about
        - services
        - contact

    SiteProjectPageOrder:
      type: object
      additionalProperties: false
      description: Ordered section IDs per fixed page key
      properties:
        home:
          type: array
          items:
            type: string
        about:
          type: array
          items:
            type: string
        services:
          type: array
          items:
            type: string
        contact:
          type: array
          items:
            type: string
      required:
        - home
        - about
        - services
        - contact

    SiteProjectDesignTokens:
      type: object
      additionalProperties: false
      properties:
        primaryColor:
          type: string
          maxLength: 64
        fontHeading:
          type: string
          maxLength: 128
        fontBody:
          type: string
          maxLength: 128
        borderRadius:
          type: string
          enum: [none, sm, md, lg, full]
        buttonStyle:
          type: string
          enum: [solid, outline, ghost]
      required:
        - primaryColor
        - fontHeading
        - fontBody
        - borderRadius
        - buttonStyle

    SiteProjectBusiness:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        category:
          type: string
          maxLength: 128
        city:
          type: string
          maxLength: 128
        phone:
          type: string
          maxLength: 64
        email:
          type: string
          maxLength: 256
        logo:
          $ref: "#/components/schemas/SiteProjectMediaAsset"
        socialLinks:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/SiteProjectSocialLink"
      required:
        - name
        - category
        - city
        - phone
        - email

    SiteProjectReceptionistSettings:
      type: object
      additionalProperties: false
      description: Non-secret receptionist display settings — never includes ownerKey
      properties:
        enabled:
          type: boolean
        receptionistId:
          type: ["string", "null"]
          maxLength: 128
        assistantName:
          type: string
          maxLength: 128
        greeting:
          type: ["string", "null"]
          maxLength: 2000
        knowledge:
          type: ["string", "null"]
          maxLength: 20000
        faqs:
          type: ["string", "null"]
          maxLength: 20000
        hours:
          type: ["string", "null"]
          maxLength: 2000
        serviceArea:
          type: ["string", "null"]
          maxLength: 2000
        escalationContact:
          type: ["string", "null"]
          maxLength: 512
        prohibitedActions:
          type: ["string", "null"]
          maxLength: 4000
        safeAutoReplyCategories:
          type: ["string", "null"]
          maxLength: 2000
        retellAgentId:
          type: ["string", "null"]
          maxLength: 256
        retellPhoneNumber:
          type: ["string", "null"]
          maxLength: 64
        provisionedAt:
          type: ["number", "null"]
          description: Client-side milliseconds since epoch
          minimum: 0
        updatedAt:
          type: ["number", "null"]
          description: Client-side milliseconds since epoch
          minimum: 0
        hostedApiUrl:
          type: ["string", "null"]
          maxLength: 512
      required:
        - enabled
        - assistantName

    SiteProjectProspectMeta:
      type: object
      additionalProperties: false
      description: >
        Server-managed lifecycle identity for an editable prospect draft.
        Ordinary customer website creation/import strips this field, while saves
        to an existing prospect preserve the authoritative stored value.
      properties:
        isDraft:
          type: boolean
          enum: [true]
        leadId:
          type: string
          minLength: 1
          maxLength: 128
        generationId:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - isDraft
        - leadId
        - generationId

    SiteProject:
      type: object
      additionalProperties: false
      description: >
        Complete editable project shape matching types.ts SiteProject.
        Never accepts server-owned ownerId/revision or server timestamps.
        ownerKey is unconditionally rejected.
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 256
        createdAt:
          type: number
          description: Client-side milliseconds since epoch
          minimum: 0
        updatedAt:
          type: number
          description: Client-side milliseconds since epoch
          minimum: 0
        activePageId:
          type: string
          enum: [home, about, services, contact]
        templateId:
          type: string
          enum: [home-services, advisor, cafe, wellness, creative, plumber, electrician, carpenter]
        designTokens:
          $ref: "#/components/schemas/SiteProjectDesignTokens"
        business:
          $ref: "#/components/schemas/SiteProjectBusiness"
        pages:
          $ref: "#/components/schemas/SiteProjectPages"
        sectionOrder:
          $ref: "#/components/schemas/SiteProjectPageOrder"
        hiddenSections:
          $ref: "#/components/schemas/SiteProjectPageOrder"
        receptionist:
          $ref: "#/components/schemas/SiteProjectReceptionistSettings"
        prospectMeta:
          $ref: "#/components/schemas/SiteProjectProspectMeta"
      required:
        - id
        - name
        - createdAt
        - updatedAt
        - activePageId
        - templateId
        - designTokens
        - business
        - pages
        - sectionOrder
        - hiddenSections

    WebsiteRecord:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, archived]
        siteType:
          type: string
          enum: [customer, prospect]
          description: >
            Website type. 'customer' is a normal editable site.
            'prospect' is an auto-generated lead-acquisition draft
            managed by the prospect lifecycle service.
        revision:
          type: number
        schemaVersion:
          type: number
        sourceUpdatedAt:
          type: ["number", "null"]
        projectSource:
          $ref: "#/components/schemas/SiteProject"
        settings:
          type: object
          additionalProperties: {}
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - status
        - siteType
        - revision
        - schemaVersion
        - projectSource
        - settings
        - createdAt
        - updatedAt

    WebsiteList:
      type: object
      additionalProperties: false
      properties:
        websites:
          type: array
          items:
            $ref: "#/components/schemas/WebsiteRecord"
      required:
        - websites

    WebsiteInput:
      type: object
      additionalProperties: false
      description: Body for creating a new website. Server owns ownerId/revision/timestamps.
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 256
        projectSource:
          $ref: "#/components/schemas/SiteProject"
        settings:
          type: object
          additionalProperties: {}
      required:
        - name
        - projectSource

    WebsiteSave:
      type: object
      additionalProperties: false
      description: Full save requires expectedRevision for optimistic concurrency.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        projectSource:
          $ref: "#/components/schemas/SiteProject"
        settings:
          type: object
          additionalProperties: {}
        expectedRevision:
          type: number
          minimum: 0
        sourceUpdatedAt:
          type: ["number", "null"]
          minimum: 0
      required:
        - projectSource
        - expectedRevision

    WebsiteRename:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        expectedRevision:
          type: number
          minimum: 0
      required:
        - name
        - expectedRevision

    WebsiteDuplicate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
      required:
        - name

    WebsiteConflict:
      type: object
      additionalProperties: false
      description: Returned on 409 so client can recover from stale revision
      properties:
        error:
          type: string
        current:
          $ref: "#/components/schemas/WebsiteRecord"
      required:
        - error
        - current

    WebsiteImportItem:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 256
        projectSource:
          $ref: "#/components/schemas/SiteProject"
        settings:
          type: object
          additionalProperties: {}
        sourceUpdatedAt:
          type: ["number", "null"]
          minimum: 0
      required:
        - id
        - name
        - projectSource

    WebsiteImportRequest:
      type: object
      additionalProperties: false
      properties:
        websites:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/WebsiteImportItem"
      required:
        - websites

    WebsiteImportItemResult:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        status:
          type: string
          enum: [imported, updated, skipped, error]
        error:
          type: ["string", "null"]
      required:
        - id
        - status

    WebsiteImportResult:
      type: object
      additionalProperties: false
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/WebsiteImportItemResult"
        imported:
          type: number
        updated:
          type: number
        skipped:
          type: number
        errors:
          type: number
      required:
        - results
        - imported
        - updated
        - skipped
        - errors

