    ProviderSettingConfigUpdate:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        config:
          $ref: "#/components/schemas/ProviderNonSecretConfig"
      required:
        - config

    ProviderAuditEvent:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        capability:
          $ref: "#/components/schemas/ProviderCapability"
        providerKey:
          type: string
        eventType:
          type: string
        outcome:
          type: string
          enum: [success, failure, skipped, unknown]
        requestId:
          type: ["string", "null"]
        externalRef:
          type: ["string", "null"]
        detail:
          type: ["string", "null"]
          description: JSON-encoded detail payload from the provider event
        occurredAt:
          type: string
          format: date-time
      required:
        - id
        - capability
        - providerKey
        - eventType
        - outcome
        - occurredAt

    ProviderAuditList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProviderAuditEvent"
      required:
        - items

