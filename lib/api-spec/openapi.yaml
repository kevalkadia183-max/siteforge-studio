  /leads/{leadId}/suppression:
    put:
      operationId: suppressLead
      tags: [lead-acquisition]
      summary: Suppress / Do Not Contact a lead
      description: >
        Applies an ordinary Do Not Contact suppression (idempotent upsert of the
        canonical suppression row). This CANNOT overwrite a permanent outreach
        opt-out: if the lead has a durable outreach opt-out row, the canonical
        "Outreach opt-out" suppression reason/timestamp/flag are preserved
        untouched and the request is rejected with 409 (no suppression row,
        flag, timestamp, or activity is written) so the detail UI and every
        other DNC consumer keep recognizing the permanent Do Not Contact.
      parameters:
        - $ref: "#/components/parameters/LeadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadSuppressionInput"
      responses:
        "200":
          description: Lead suppressed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadRecord"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Feature disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            The lead has permanently opted out of outreach; that canonical Do
            Not Contact status cannot be overwritten by an ordinary suppression.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unsuppressLead
      tags: [lead-acquisition]
      summary: Remove suppression from a lead
      description: >
        Removes an ordinary Do Not Contact suppression. This CANNOT remove a
        permanent outreach opt-out: if the lead has a durable outreach opt-out
        row, the canonical suppression is preserved and the request is rejected
        with 409 so prospect generation, dashboards, and every other DNC
        consumer stay blocked.
      parameters:
        - $ref: "#/components/parameters/LeadId"
      responses:
        "200":
          description: Suppression removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadRecord"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Feature disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Lead not found or not suppressed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            The lead has permanently opted out of outreach; that Do Not Contact
            status cannot be removed with unsuppress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Prospect Lifecycle Routes ─────────────────────────────────────────────
  /leads/{leadId}/prospect-site:
    get:
      operationId: getProspectSite
      tags: [lead-acquisition]
      summary: Get the prospect lifecycle record for a lead (null if none exists)
      description: >
        Always returns HTTP 200. Returns the ProspectSiteRecord when a lifecycle
        exists for the lead, or null when no prospect has been generated yet.
        This gives the UI a stable empty state without special-casing 404.
        Returns 404 only if the lead itself does not belong to the owner.
      parameters:
        - $ref: "#/components/parameters/LeadId"
      responses:
        "200":
          description: Prospect lifecycle record, or null if no lifecycle exists
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProspectSiteRecord"
                  - type: "null"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Feature disabled
          content:
            application/json:
