openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: previews
    description: Temporary client preview operations
  - name: receptionist
    description: AI receptionist management (owner-authenticated)
  - name: widget
    description: Public widget endpoints (no auth required)
  - name: accounts
    description: Authenticated account management (Clerk session)
  - name: websites
    description: Authenticated website management (Clerk session)
  - name: lead-acquisition
    description: Lead acquisition module (owner-scoped, Clerk session)
  - name: providers
    description: Provider settings and audit (owner-scoped, Clerk session)
  - name: leads-consent
    description: Lead channel consent management (owner-scoped, Clerk session)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /previews:
    post:
      operationId: publishPreview
      tags: [previews]
      summary: Publish a temporary client preview
      parameters:
        - $ref: "#/components/parameters/EditorKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewPublishRequest"
      responses:
        "201":
          description: Preview published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewPublication"
        "400":
          description: Invalid preview payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Preview payload too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Preview publishing quota exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Preview capacity temporarily full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Preview service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /previews/{previewId}/refresh:
    post:
      operationId: refreshPreview
      tags: [previews]
      summary: Republish the latest project and rotate its preview link
      parameters:
        - $ref: "#/components/parameters/PreviewId"
        - $ref: "#/components/parameters/EditorKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewRefreshRequest"
      responses:
        "200":
          description: Preview refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewPublication"
        "400":
          description: Invalid preview payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Preview payload too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Preview not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Preview service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /previews/{previewId}:
    delete:
      operationId: revokePreview
      tags: [previews]
      summary: Revoke a temporary client preview
      parameters:
        - $ref: "#/components/parameters/PreviewId"
        - $ref: "#/components/parameters/EditorKey"
      responses:
        "204":
          description: Preview revoked
        "400":
          description: Invalid preview identifier or editor key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Preview not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Preview service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Receptionist: Owner Endpoints ───────────────────────────────────────
  /receptionist:
    post:
      operationId: createReceptionist
      tags: [receptionist]
      summary: Create a receptionist for the signed-in owner or legacy pilot
      parameters:
        - $ref: "#/components/parameters/SetupKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceptionistInput"
      responses:
        "201":
          description: Receptionist created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceptionistCreated"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign-in required or invalid pilot setup key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Pilot receptionist already provisioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Pilot setup key is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /receptionist/{receptionistId}/settings:
    get:
      operationId: getReceptionistSettings
      tags: [receptionist]
      summary: Get receptionist settings
      parameters:
        - $ref: "#/components/parameters/ReceptionistId"
        - $ref: "#/components/parameters/OwnerKey"
      responses:
        "200":
          description: Settings retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceptionistSettings"
        "401":
          description: Invalid owner key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Receptionist not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateReceptionistSettings
      tags: [receptionist]
      summary: Update receptionist settings
      parameters:
        - $ref: "#/components/parameters/ReceptionistId"
        - $ref: "#/components/parameters/OwnerKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceptionistSettingsUpdate"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceptionistSettings"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid owner key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Receptionist not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /receptionist/{receptionistId}/conversations:
    get:
      operationId: listReceptionistConversations
      tags: [receptionist]
      summary: List conversations for this receptionist
      parameters:
        - $ref: "#/components/parameters/ReceptionistId"
        - $ref: "#/components/parameters/OwnerKey"
      responses:
        "200":
          description: Conversation list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPage"
        "401":
          description: Invalid owner key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Receptionist not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /receptionist/{receptionistId}/conversations/{conversationId}:
    get:
      operationId: getConversation
      tags: [receptionist]
      summary: Get a conversation with its messages
      parameters:
        - $ref: "#/components/parameters/ReceptionistId"
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/OwnerKey"
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "401":
          description: Invalid owner key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /receptionist/{receptionistId}/conversations/{conversationId}/reply:
    post:
      operationId: ownerReply
      tags: [receptionist]
      summary: Send an owner reply into a conversation
      parameters:
        - $ref: "#/components/parameters/ReceptionistId"
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/OwnerKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerReplyInput"
      responses:
        "201":
          description: Reply sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid owner key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /receptionist/{receptionistId}/conversations/{conversationId}/status:
    patch:
      operationId: updateConversationStatus
      tags: [receptionist]
      summary: Resolve or reopen a conversation
      parameters:
        - $ref: "#/components/parameters/ReceptionistId"
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/OwnerKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationStatusUpdate"
      responses:
        "200":
          description: Conversation status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationStatus"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid owner key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conversation status changed before this update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /receptionist/{receptionistId}/gmail/sync:
    post:
      operationId: syncGmail
      tags: [receptionist]
      summary: Sync Gmail inbox and create AI reply suggestions
      parameters:
        - $ref: "#/components/parameters/ReceptionistId"
        - $ref: "#/components/parameters/OwnerKey"
      responses:
        "200":
          description: Gmail sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailSyncResult"
        "401":
          description: Invalid owner key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Receptionist not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Gmail connector error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /receptionist/{receptionistId}/gmail/messages/{messageId}/approve:
    post:
      operationId: approveEmailDraft
      tags: [receptionist]
      summary: Approve an AI email draft and create a Gmail draft
      parameters:
        - $ref: "#/components/parameters/ReceptionistId"
        - $ref: "#/components/parameters/MessageId"
        - $ref: "#/components/parameters/OwnerKey"
      responses:
        "200":
          description: Draft created in Gmail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailApprovalResult"
        "401":
          description: Invalid owner key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Message not found or not pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Gmail connector error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /receptionist/{receptionistId}/gmail/messages/{messageId}/recover:
    post:
      operationId: recoverEmailDraft
      tags: [receptionist]
      summary: Safely recover an interrupted Gmail draft reconciliation
      parameters:
        - $ref: "#/components/parameters/ReceptionistId"
        - $ref: "#/components/parameters/MessageId"
        - $ref: "#/components/parameters/OwnerKey"
      responses:
        "200":
          description: Existing Gmail draft recovered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailApprovalResult"
        "401":
          description: Invalid owner key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Recovery is unavailable, still running, or ready for approval retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Gmail connector error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /receptionist/{receptionistId}/gmail/messages/{messageId}/reject:
    post:
      operationId: rejectEmailDraft
      tags: [receptionist]
      summary: Reject an AI email draft
      parameters:
        - $ref: "#/components/parameters/ReceptionistId"
        - $ref: "#/components/parameters/MessageId"
        - $ref: "#/components/parameters/OwnerKey"
      responses:
        "200":
          description: Draft rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailApprovalResult"
        "401":
          description: Invalid owner key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Message not found or not pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /receptionist/{receptionistId}/retell/sync:
    post:
      operationId: syncRetellCalls
      tags: [receptionist]
      summary: Sync Retell call history
      parameters:
        - $ref: "#/components/parameters/ReceptionistId"
        - $ref: "#/components/parameters/OwnerKey"
      responses:
        "200":
          description: Retell sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetellSyncResult"
        "401":
          description: Invalid owner key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Receptionist not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Retell connector error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Accounts: Cookie-authenticated Clerk endpoints ──────────────────────
  /account:
    get:
      operationId: getAccount
      tags: [accounts]
      summary: Get the current authenticated account
      responses:
        "200":
          description: Account info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountInfo"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Websites ─────────────────────────────────────────────────────────────
  /websites:
    get:
      operationId: listWebsites
      tags: [websites]
      summary: List all websites owned by the authenticated user
      responses:
        "200":
          description: Website list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createWebsite
      tags: [websites]
      summary: Create a new website for the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsiteInput"
      responses:
        "201":
          description: Website created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteRecord"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /websites/import:
    post:
      operationId: importWebsites
      tags: [websites]
      summary: Batch import websites (idempotent per owner+id)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsiteImportRequest"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteImportResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /websites/{websiteId}:
    get:
      operationId: getWebsite
      tags: [websites]
      summary: Get a single website by ID
      parameters:
        - $ref: "#/components/parameters/WebsiteId"
      responses:
        "200":
          description: Website record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteRecord"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Website not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: saveWebsite
      tags: [websites]
      summary: Full save of a website (requires expectedRevision for conflict detection)
      parameters:
        - $ref: "#/components/parameters/WebsiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsiteSave"
      responses:
        "200":
          description: Website saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteRecord"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Website not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Stale revision conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteConflict"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: renameWebsite
      tags: [websites]
      summary: Rename a website (name only, requires expectedRevision for conflict detection)
      parameters:
        - $ref: "#/components/parameters/WebsiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsiteRename"
      responses:
        "200":
          description: Website renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteRecord"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Website not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Revision conflict — another save completed after the client last read this website
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteConflict"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteWebsite
      tags: [websites]
      summary: Delete a website
      parameters:
        - $ref: "#/components/parameters/WebsiteId"
      responses:
        "204":
          description: Website deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Website not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /websites/{websiteId}/duplicate:
    post:
      operationId: duplicateWebsite
      tags: [websites]
      summary: Duplicate a website (gets new server id, credentials stripped)
      parameters:
        - $ref: "#/components/parameters/WebsiteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsiteDuplicate"
      responses:
        "201":
          description: Website duplicated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteRecord"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Website not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
